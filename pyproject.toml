[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scte"
version = "1.2.0"
description = "Tools for working with SCTE standards."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [
    { name = "James Fining", email = "james.fining@nbcuni.com" },
]
keywords = ["scte", "scte35", "transport", "stream", "broadcast"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Multimedia",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "bitstring>=4.0,<5.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/jamesfining/scte"
Repository = "https://github.com/jamesfining/scte"

[tool.setuptools.packages.find]
include = ["scte*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
